<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мемологія: урок 11 класу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: липка «стрічка уроку» (етапи + таймер + прогрес) і стрічка секцій,
   кожна зі своїм «матеріалом»: наліпки, темна галерея, папір у клітинку, зошит у лінійку, телефони, справи груп. */
:root{
  --lime:#99cc00; --violet:#9d6bdb; --yellow:#f7c915;
  --wrong:#c13f2c; --right:#3f7a16;
  --bg:#ffffff; --surface:#faf8fc; --surface-2:#f1ecf7; --line:#e5e0ee;
  --text:#1e1b26; --muted:color-mix(in srgb,var(--text) 64%,transparent);
  --ink:#1e1b26; --paper:#fffdf6; --rule:#cfe0f5; --margin:#f0a3a3;
  --night:#1e1b26; --night-2:#2a2536; --night-text:#f4f1f9;
  --glass:color-mix(in srgb,var(--bg) 82%,transparent);
  --f-display:'Unbounded','Rubik',system-ui,sans-serif;
  --f-text:'Manrope','PT Sans','Fira Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono','PT Mono',ui-monospace,monospace;
  --r:22px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12101a; --surface:#1b1826; --surface-2:#231f33; --line:#332d44; --text:#f4f1f9;
  --wrong:#ff7a5e; --right:#a5d914; --paper:#1b1826; --rule:#2b3550; --margin:#6b3640;
  --night:#0b0a10; --night-2:#1b1826; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12101a; --surface:#1b1826; --surface-2:#231f33; --line:#332d44; --text:#f4f1f9;
  --wrong:#ff7a5e; --right:#a5d914; --paper:#1b1826; --rule:#2b3550; --margin:#6b3640;
  --night:#0b0a10; --night-2:#1b1826; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:17px;line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:clamp(26px,4.4vw,44px);font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.col{max-width:66ch}
.muted{color:var(--muted)}

/* ---------- Стрічка уроку ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:900;font-size:14px;white-space:nowrap}
.brand b{background:var(--lime);color:var(--ink);padding:2px 7px;border-radius:7px;margin-left:4px}
.done-pill{font-family:var(--f-mono);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.done-pill b{color:var(--right)}
.spacer{flex:1}
.now-lbl{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clock{font-family:var(--f-mono);font-weight:600;font-size:16px;min-width:5ch;text-align:right}
.steps{display:flex;gap:4px;padding-bottom:9px;list-style:none;margin:0;padding-left:0}
.steps li{min-width:0}
.steps a{display:block;text-decoration:none;min-width:0}
.seg{display:block;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--lime),var(--yellow));transition:width .8s}
.steps li.now .seg{box-shadow:0 0 0 2px var(--violet)}
.steps small{display:flex;gap:4px;align-items:center;font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.steps li.now small{color:var(--text)}
.steps li.ok small::before{content:"✓";color:var(--right);font-weight:900}
.scrollbar{height:3px;background:transparent}
.scrollbar i{display:block;height:100%;width:0;background:var(--violet)}

.btn{font-weight:800;font-size:14px;border:0;cursor:pointer;border-radius:999px;padding:9px 16px;background:var(--lime);color:var(--ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px var(--lime)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.violet{background:var(--violet);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:48px 34px}
.mark{position:absolute;pointer-events:none;user-select:none;opacity:.12;z-index:0}
.mark.r{right:-15%;top:-6%;width:44%;max-width:540px}
.mark.l{left:-18%;bottom:-24%;width:36%;max-width:440px;opacity:.1}
.hero .wrap{position:relative;z-index:1}
.logo{display:block;width:clamp(132px,22vw,180px);height:auto;margin-bottom:26px}
.hero h1{font-size:clamp(40px,8.4vw,98px);font-weight:900;line-height:.98;letter-spacing:-.025em}
.hl{background:var(--lime);color:var(--ink);padding:0 .14em;border-radius:.16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.out{color:transparent;-webkit-text-stroke:2px var(--text)}
.lead{font-size:clamp(17px,2vw,20px);margin-top:20px;max-width:58ch}
.sticker{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:13px;padding:7px 13px;border-radius:10px;color:var(--ink);transform:rotate(-3deg);box-shadow:3px 3px 0 var(--text)}
.sticker.y{background:var(--yellow)}.sticker.v{background:var(--violet);color:#fff}.sticker.g{background:var(--lime)}
.tags{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.tags .sticker:nth-child(2){transform:rotate(2deg)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:30px}
.meta div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 16px}
.meta small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta strong{font-family:var(--f-display);font-size:16px}
.tip{margin-top:16px;font-size:14px;color:var(--muted)}
.tip b{color:var(--text)}

.ticker{background:var(--text);color:var(--bg);overflow:hidden;padding-block:11px;border-block:3px solid var(--lime);transform:rotate(-1deg);margin-block:6px 10px}
.ticker-track{display:flex;gap:40px;width:max-content;animation:run 40s linear infinite;font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.ticker-track span::after{content:"✦";color:var(--lime);margin-left:40px}
@keyframes run{to{transform:translateX(-50%)}}

/* ---------- Секції та «матеріали» ---------- */
section.sec{padding-block:52px;position:relative}
.sec-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.min{background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:3px 9px;border-radius:999px}
.subj{display:inline-flex;gap:6px}
.subj i{font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;color:var(--ink);letter-spacing:.02em}
.subj .m{background:var(--lime)}.subj .lt{background:var(--yellow)}.subj .h{background:var(--violet);color:#fff}
.score{font-family:var(--f-mono);font-weight:600;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.teacher{margin-top:18px;font-size:14px;border-left:3px solid var(--violet);padding:4px 0 4px 12px;color:var(--muted);max-width:80ch}
.teacher b{color:var(--text)}
.task-n{font-family:var(--f-display);font-weight:900;font-size:13px;background:var(--text);color:var(--bg);border-radius:8px;padding:4px 10px;display:inline-block}

.band-yellow{background:color-mix(in srgb,var(--yellow) 26%,var(--bg))}
.band-lime{background:color-mix(in srgb,var(--lime) 20%,var(--bg))}
.band-violet{background:color-mix(in srgb,var(--violet) 22%,var(--bg))}
.band-night{background:var(--night);color:var(--night-text)}
.band-night .eyebrow,.band-night .muted{color:color-mix(in srgb,var(--night-text) 66%,transparent)}
.band-night .min{background:var(--night-2);border-color:#3a3448;color:var(--night-text)}
.band-night .score{background:var(--night-text);color:var(--night)}
.band-night .teacher{color:color-mix(in srgb,var(--night-text) 70%,transparent)}
.band-night .teacher b{color:var(--night-text)}
.grid-paper{background-color:var(--paper);background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:26px 26px}
.notebook{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),repeating-linear-gradient(var(--paper) 0 31px,var(--rule) 31px 32px)}

/* Зображення мемів: завжди повністю видно, клік — на весь екран */
.pic{display:block;width:100%;background:#0f0d14;border:0;padding:0;cursor:zoom-in;position:relative;overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:contain}
.pic::after{content:"⤢";position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.pic:hover::after,.pic:focus-visible::after{opacity:1}

/* 1. Розминка: наліпки-голосування */
.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mood{background:var(--bg);border:2px solid var(--text);border-radius:16px;padding:8px 8px 12px;cursor:pointer;text-align:left;display:grid;gap:8px;box-shadow:5px 5px 0 var(--text);transition:transform .15s}
.mood:nth-child(odd){transform:rotate(-1.5deg)}.mood:nth-child(even){transform:rotate(1.2deg)}
.mood:hover{transform:rotate(0) translateY(-3px)}
.mood .ph{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#0f0d14}
.mood .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mood b{font-family:var(--f-display);font-size:14px;line-height:1.25;padding-inline:4px}
.mood span{font-size:13px;color:var(--muted);padding-inline:4px}
.votes{position:absolute;top:-12px;right:-10px;min-width:36px;height:36px;border-radius:999px;background:var(--violet);color:#fff;font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;padding-inline:8px;border:2px solid var(--text)}
.mood{position:relative}
.mood .votes[hidden]{display:none}

/* 2. Теорія */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.card.lime{background:var(--lime);color:var(--ink);border-color:transparent}
.card.violet{background:var(--violet);color:#fff;border-color:transparent}
.big{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,6vw,72px);line-height:1}
.anat{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.anat .arrow{font-family:var(--f-display);font-size:32px;font-weight:900;color:var(--violet)}
.fig{display:grid;gap:8px;min-width:0}
.fig .pic{aspect-ratio:4/3;border-radius:14px}
.fig figcaption,.fig p.cap{font-size:14px;color:var(--muted)}
.fig b.lab{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text)}
.forms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.forms .fig{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.forms .fig .pic{border-radius:10px}
.form-tag{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:800;background:var(--yellow);color:var(--ink);padding:3px 9px;border-radius:7px}

.evo{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.evo article{scroll-snap-align:start;background:var(--night-2);border:1px solid #3a3448;border-radius:18px;padding:10px;display:grid;gap:10px;align-content:start;min-width:0}
.evo .pic{aspect-ratio:1;border-radius:12px}
.evo .yr{font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--lime);line-height:1}
.evo h3{font-size:15px;color:var(--night-text)}
.evo p{font-size:13.5px;color:color-mix(in srgb,var(--night-text) 72%,transparent)}
.roots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.roots div{border:1px dashed #4a4360;border-radius:14px;padding:14px}
.roots b{font-family:var(--f-display);color:var(--yellow);font-size:20px;display:block}
.roots p{font-size:14px;color:color-mix(in srgb,var(--night-text) 76%,transparent)}

/* 3. Квіз-полароїди */
.polas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:22px}
.pola{background:var(--bg);border-radius:6px;padding:12px 12px 14px;box-shadow:0 2px 0 var(--line),0 16px 30px -18px rgba(30,27,38,.45);display:grid;gap:10px;align-content:start;min-width:0;border:1px solid var(--line)}
.pola:nth-child(3n+1){transform:rotate(-1.2deg)}.pola:nth-child(3n+2){transform:rotate(.8deg)}
.pola .pic{aspect-ratio:1;border-radius:3px}
.pola .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opts{display:grid;gap:7px}
.opt{font-size:14px;font-weight:700;text-align:left;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.3}
.opt:hover{border-color:var(--violet)}
.opt.ok{border-color:var(--right);background:color-mix(in srgb,var(--right) 14%,transparent);color:var(--right)}
.opt.bad{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 12%,transparent);color:var(--wrong);text-decoration:line-through}
.explain{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* 4. Детектив: картки з категоріями */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.cat{font-family:var(--f-display);font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:9px;color:var(--ink)}
.c-q{background:var(--yellow)}.c-p{background:var(--lime)}.c-b{background:#c9b2ef}.c-s{background:#ffb48a}
.dets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.det{background:var(--bg);border:1.5px solid var(--text);border-radius:14px;overflow:hidden;display:grid;align-content:start;min-width:0}
.det .pic{aspect-ratio:4/3}
.det .body{padding:10px;display:grid;gap:8px}
.det .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.det .chips button{font-size:12px;font-weight:800;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);padding:6px 4px;cursor:pointer}
.det .chips button.ok{background:color-mix(in srgb,var(--right) 16%,transparent);border-color:var(--right);color:var(--right)}
.det .chips button.bad{border-color:var(--wrong);color:var(--wrong);text-decoration:line-through}
.det.solved{border-color:var(--right)}
.det .why{font-size:13px;color:var(--muted)}

/* 5. Мовна лабораторія: зошит */
.lab{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.lab-item{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;box-shadow:0 10px 24px -20px rgba(30,27,38,.6)}
.lab-item .pic{aspect-ratio:1;border-radius:10px}
.lab-item q{font-weight:700;font-size:14.5px;line-height:1.35;quotes:none;display:block;margin-bottom:8px}
.lab-item .opts .opt{font-size:13px;padding:7px 9px}
.lab-item .explain{grid-column:1/-1}
.rule{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip-w{background:color-mix(in srgb,var(--wrong) 14%,transparent);color:var(--wrong);text-decoration:line-through;text-decoration-thickness:2px;font-weight:700;padding:3px 9px;border-radius:8px}
.chip-r{background:color-mix(in srgb,var(--right) 14%,transparent);color:var(--right);font-weight:700;padding:3px 9px;border-radius:8px}

/* 6. Хронологія: кадри плівки */
.film{background:#141119;border-radius:18px;padding:22px 14px;position:relative;overflow-x:auto}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,transparent 0 10px,#3a3448 10px 22px)}
.film::before{top:6px}.film::after{bottom:6px}
.frames{display:grid;grid-template-columns:repeat(7,170px);gap:12px;width:max-content}
.frame{background:#221d2c;border:2px solid #3a3448;border-radius:10px;padding:8px;display:grid;gap:8px;cursor:pointer;color:#f4f1f9;text-align:left;position:relative;width:100%}
.frame .ph{aspect-ratio:1;border-radius:6px;overflow:hidden;background:#0f0d14}
.frame .ph img{width:100%;height:100%;object-fit:contain;display:block}
.frame span{font-size:12.5px;line-height:1.3}
.frame .ord{position:absolute;top:-10px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#1e1b26;font-family:var(--f-display);font-weight:900;display:grid;place-items:center;border:2px solid #141119}
.frame .ord[hidden]{display:none}
.frame.picked{border-color:var(--yellow)}
.frame.good{border-color:var(--lime)}
.frame.badpos{border-color:#ff7a5e}
.frame .when{font-family:var(--f-mono);font-size:11.5px;color:var(--lime)}
.chrono-ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}

/* 7. Мем-музей: темна стіна */
.museum{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,260px);gap:22px;overflow-x:auto;padding:12px 4px 18px;scroll-snap-type:x proximity}
.exh{scroll-snap-align:start;display:grid;gap:10px;align-content:start}
.exh .frame-g{background:#f5efe2;padding:12px;border-radius:4px;box-shadow:0 0 0 6px #3b2f22,0 22px 40px -12px rgba(0,0,0,.8)}
.exh .pic{aspect-ratio:1;background:#e9e1cf}
.plaque{background:#2a2536;border:1px solid #3a3448;border-radius:6px;padding:9px 11px}
.plaque .no{font-family:var(--f-mono);font-size:11px;color:var(--yellow)}
.plaque b{display:block;font-size:13.5px;color:#f4f1f9;line-height:1.3}
.plaque p{font-size:12.5px;color:#c9c3d6;line-height:1.4;margin-top:3px}

/* 8. GIF-лабораторія: телефони */
.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:900px}
.phone{background:#141119;border-radius:36px;padding:14px;box-shadow:0 0 0 2px #3a3448,0 26px 50px -20px rgba(0,0,0,.6);display:grid;gap:10px;min-width:0}
.phone .notch{width:90px;height:8px;border-radius:999px;background:#2a2536;margin:2px auto 4px}
.phone .pic{aspect-ratio:1;border-radius:20px;background:#0f0d14}
.phone label{font-size:13px;font-weight:700;color:#f4f1f9}
.phone input{font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid #3a3448;background:#221d2c;color:#f4f1f9;width:100%}
.phone p{font-size:13px;color:#c9c3d6}
.vlinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.vlinks .btn{white-space:normal;text-align:left}

/* 9. Групи: справи */
.gtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.gtab{border:2px solid var(--text);border-radius:14px;padding:10px 14px;background:var(--bg);cursor:pointer;display:grid;gap:2px;text-align:left;min-width:0}
.gtab b{font-family:var(--f-display);font-size:15px}
.gtab small{font-size:12px;color:var(--muted)}
.gtab[aria-selected="true"]{box-shadow:5px 5px 0 var(--violet);background:var(--surface)}
.gtab .gn{font-family:var(--f-display);font-weight:900;font-size:12px;width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink);margin-right:6px}
.gpanel{border:2px solid var(--text);border-radius:var(--r);background:var(--bg);overflow:hidden}
.gpanel-head{padding:18px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink)}
.gpanel-head h3{font-size:22px}
.gpanel-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding:20px}
.gsteps{margin:0;padding-left:20px;display:grid;gap:8px}
.gsteps li::marker{font-family:var(--f-display);font-weight:800;color:var(--violet)}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.mats .pic{aspect-ratio:1;border-radius:10px}
.prompt{font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--text);color:var(--bg);border-radius:var(--r-sm);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-block:8px}
.checks{display:grid;gap:7px;margin-top:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--right);flex:none;margin-top:1px}
.gtimer{display:flex;gap:10px;align-items:center}
.gtimer output{font-family:var(--f-mono);font-weight:600;font-size:22px}
.product{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:14.5px}
.product b{font-family:var(--f-display);font-size:13px}

/* Конструктор */
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.maker canvas,.maker #outImg{width:100%;max-width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);display:block}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input[type=text]{font-size:16px;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--bg);color:var(--text);width:100%}
.tpls{display:flex;gap:8px;flex-wrap:wrap}
.tpl{width:62px;height:62px;border-radius:12px;border:2px solid var(--line);cursor:pointer;padding:0;overflow:hidden;background:#0f0d14}
.tpl img{width:100%;height:100%;object-fit:cover;display:block}
.tpl[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:2px}
.stack{display:grid;gap:14px}

/* 10. Рефлексія */
.refl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.hw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:22px}

/* Лайтбокс */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,8,14,.92);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb[hidden]{display:none}
.lb img{max-width:min(96vw,1100px);max-height:80vh;object-fit:contain;border-radius:10px;background:#000}
.lb p{color:#f4f1f9;font-size:15px;margin-top:12px;text-align:center;max-width:70ch}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}

footer{border-top:1px solid var(--line);padding-block:28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

@media (max-width:980px){
  .moods,.forms,.refl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gpanel-body,.maker,.hw{grid-template-columns:minmax(0,1fr)}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .s2,.s3,.s4,.s6{grid-column:span 2}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mark.r{right:-30%;top:-6%;width:70%;opacity:.08}
  .mark.l{left:-30%;bottom:-8%;width:62%;opacity:.08}
  .brand{display:none}
  .steps small{display:none}
}
@media (max-width:620px){
  .anat{grid-template-columns:minmax(0,1fr)}
  .anat .arrow{transform:rotate(90deg);justify-self:center}
  .phones{grid-template-columns:minmax(0,1fr)}
  .lab-item{grid-template-columns:90px minmax(0,1fr)}
  .moods{gap:14px}
  .done-pill{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* Мем-мемо */
.memo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.mcard{aspect-ratio:3/4;border-radius:14px;border:0;padding:0;cursor:pointer;perspective:800px;background:none}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.mcard .f{background:repeating-linear-gradient(45deg,var(--lime) 0 14px,#8bbb00 14px 28px);display:grid;place-items:center;border:2px solid var(--text)}
.mcard .f span{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--ink)}
.mcard .b{transform:rotateY(180deg);background:#0f0d14;border:2px solid var(--text)}
.mcard .b img{width:100%;height:100%;object-fit:contain}
.mcard.got .b{border-color:var(--right);box-shadow:0 0 0 3px var(--right)}
.memo-found{display:grid;gap:8px;margin-top:16px}
.memo-found p{font-size:14px;background:var(--bg);border-left:4px solid var(--right);padding:8px 12px;border-radius:8px}

/* Цитатник */
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.qcard{background:var(--bg);border-radius:var(--r);padding:16px;display:grid;gap:10px;position:relative;border:1px solid var(--line);min-width:0;align-content:start}
.qcard::before{content:"«";position:absolute;top:-28px;left:10px;font-family:var(--f-display);font-weight:900;font-size:90px;color:var(--violet);line-height:1}
.qcard .pic{aspect-ratio:4/3;border-radius:12px}
.qcard blockquote{margin:0;font-weight:800;font-size:15px;line-height:1.35}

/* Майстерня шаблонів: нотатки */
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}
.pad{background:#fff6b8;color:#1e1b26;padding:10px 10px 14px;border-radius:4px 4px 18px 4px;box-shadow:0 14px 24px -16px rgba(0,0,0,.5);display:grid;gap:8px;min-width:0;align-content:start}
.pad:nth-child(3n+2){background:#d9f2a3;transform:rotate(1deg)}.pad:nth-child(3n){background:#e4d6fa;transform:rotate(-1deg)}
.pad .pic{aspect-ratio:4/3;border-radius:3px}
.pad b{font-size:13px}
.pad input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(30,27,38,.25);background:rgba(255,255,255,.75);color:#1e1b26;width:100%}

/* Кіновікторина: квитки */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.ticket{background:var(--night-2);border:1px solid #3a3448;border-radius:14px;overflow:hidden;display:grid;align-content:start;min-width:0}
.ticket .pic{aspect-ratio:16/9;border-bottom:2px dashed #3a3448}
.ticket .body{padding:14px 12px 12px;display:grid;gap:8px}
.ticket .opt{background:#221d2c;border-color:#3a3448;color:#f4f1f9}
.ticket .explain{color:#c9c3d6;border-color:#3a3448}
.film-hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:24px}
.film-hero .pic{aspect-ratio:3/4;border-radius:16px}

/* Правда чи міф: газета */
.news{background:var(--paper);border-block:4px double var(--text)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px}
.fact{border-top:3px solid var(--text);padding-top:10px;display:grid;gap:10px;align-content:start;position:relative;min-width:0}
.fact .pic{aspect-ratio:4/3;border-radius:4px}
.fact .claim{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.3}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .opt{text-align:center;font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.stamp{position:absolute;top:24px;right:10px;font-family:var(--f-display);font-weight:900;font-size:18px;padding:4px 10px;border:3px solid currentColor;border-radius:8px;transform:rotate(-8deg);background:var(--paper)}
.stamp.t{color:var(--right)}.stamp.f{color:var(--wrong)}

/* Світлофор етики */
.ethics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.eth{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;align-content:start;min-width:0}
.eth .pic{aspect-ratio:4/3}
.eth .body{padding:12px;display:grid;gap:10px}
.lights{display:flex;gap:8px}
.light{flex:1;border:2px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--surface);cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:800}
.light i{width:22px;height:22px;border-radius:50%;display:block;opacity:.4}
.light.g i{background:#3fbf3f}.light.y i{background:#f7c915}.light.r i{background:#e5484d}
.light[aria-pressed="true"]{border-color:var(--text)}
.light[aria-pressed="true"] i{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.eth .take{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.eth .take b{color:var(--text)}


/* Layout: презентація 16:9. Сцена 1600×900 масштабується під екран; внизу — док зі стрічкою прогресу і навігацією. */
:root{--deck:#0d0b12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--deck:#050407}}
:root[data-theme="dark"]{--deck:#050407}
main{font-size:18px}
.slide{padding-block:56px;position:relative}
.slide>.wrap{display:flex;flex-direction:column;gap:16px;position:relative}
.slide .wrap>.body{flex:1 0 auto}
[hidden]{display:none!important}
.slide h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.slide .sub{font-size:19px;color:var(--muted);max-width:75ch;margin-top:8px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.slide .eyebrow{margin-bottom:8px}
.pill{font-family:var(--f-mono);font-weight:600;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:15px;white-space:nowrap}
.band-night .pill{background:var(--night-text);color:var(--night)}
.s-yellow{background:color-mix(in srgb,var(--yellow) 26%,var(--bg))}
.s-lime{background:color-mix(in srgb,var(--lime) 22%,var(--bg))}
.s-violet{background:color-mix(in srgb,var(--violet) 22%,var(--bg))}
.s-paper{background-color:var(--paper)}

.g{display:grid;gap:18px;align-content:start;align-items:start}
.c2{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}.c3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.c4{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}.c5{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}.c6{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.pic.a43{aspect-ratio:4/3}.pic.a169{aspect-ratio:16/9}.pic.a11{aspect-ratio:1}.pic.a21{aspect-ratio:2/1}.pic.a1610{aspect-ratio:16/10}.pic.a34{aspect-ratio:3/4}.pic.a41{aspect-ratio:4/1}.pic.a52{aspect-ratio:5/2}
.pic{border-radius:12px}

/* Титул */
.title-slide{overflow:hidden;padding-block:48px 40px}
.title-slide .mark{position:absolute;pointer-events:none;opacity:.12}
.title-slide .mark.r{right:-8%;top:-12%;width:46%}
.title-slide .mark.l{left:-10%;bottom:-30%;width:34%;opacity:.1}
.title-slide h1{font-size:clamp(44px,8vw,100px);font-weight:900;line-height:.96;letter-spacing:-.025em;position:relative}
.title-slide .lead{font-size:24px;max-width:52ch;position:relative}
.keys{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;position:relative}
.keys span{font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.keys kbd{font-family:var(--f-mono);font-weight:600;background:var(--text);color:var(--bg);border-radius:6px;padding:1px 7px;margin-right:4px}

/* Докінз */
.dawkins{display:grid;grid-template-columns:330px 230px minmax(0,1fr);gap:28px;align-items:stretch}
.dawkins .ph{border-radius:20px;overflow:hidden;background:#000}
.dawkins .ph .pic{height:100%;background:#000}
.dawkins blockquote{margin:0;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.08;letter-spacing:-.01em}
.dawkins blockquote em{font-style:normal;background:var(--lime);color:var(--ink);padding:0 .12em;border-radius:.12em}
.chips3{display:flex;gap:10px;flex-wrap:wrap}
.chips3 span{font-family:var(--f-display);font-weight:800;font-size:15px;padding:9px 14px;border-radius:10px;color:var(--ink)}

/* Історія */
.era{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;color:var(--violet)}
.era small{display:block;font-size:20px;color:var(--muted);margin-top:8px;font-weight:700}
.histtext p{font-size:19px;line-height:1.55}
.histtext p+p{margin-top:12px}
.evo-g article{background:var(--night-2);border:1px solid #3a3448;border-radius:14px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.evo-g .yr{font-family:var(--f-display);font-weight:900;font-size:21px;color:var(--lime);line-height:1}
.evo-g h3{font-size:14px;color:var(--night-text)}
.evo-g p{font-size:12.5px;line-height:1.35;color:color-mix(in srgb,var(--night-text) 72%,transparent)}
.slide.band-night{background:var(--night);color:var(--night-text)}
.slide.band-night .sub,.slide.band-night .eyebrow,.slide.band-night .muted{color:color-mix(in srgb,var(--night-text) 68%,transparent)}
.slide.band-night .min{background:var(--night-2);border-color:#3a3448;color:var(--night-text)}
.mus .pic{aspect-ratio:16/10}
.mus .exh .frame-g{padding:8px;box-shadow:0 0 0 5px #3b2f22,0 16px 30px -12px rgba(0,0,0,.8)}
.mus .plaque{padding:7px 9px}
.mus .plaque b{font-size:12.5px}.mus .plaque p{font-size:11.5px}

/* Форми */
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.form p{font-size:14.5px;color:var(--muted);line-height:1.4}
.form .tile{aspect-ratio:2/1;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--f-display);font-weight:800;font-size:22px}

/* Мем-мемо */
.memo-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.memo{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.mcard{aspect-ratio:4/3}
.memo-found p{font-size:15px}

/* Компактні варіанти компонентів у сцені */
main .moods{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:22px;align-content:start;align-items:start}
main .mood .ph{aspect-ratio:16/10}
main .opt{font-size:15px;padding:8px 11px}
main .explain{font-size:14px}
.qcard{padding:12px}
.qcard::before{font-size:70px;top:-22px}
.qcard blockquote{font-size:15px}
.det .body{padding:9px;gap:6px}
.det .chips button{font-size:12.5px;padding:6px 4px}
.lab-item{grid-template-columns:110px minmax(0,1fr);padding:10px;gap:12px}
.lab-item .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.lab-item .opts .opt{font-size:12.5px;padding:7px 8px}
.lab-item q{font-size:15px;margin-bottom:6px}
.lab-item .explain{font-size:13.5px}
.ticket .body{padding:12px 10px 10px}
.fact .claim{font-size:16px}
.frames{grid-template-columns:repeat(7,170px)!important}
.phones{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))!important;max-width:none!important;gap:30px}
.phone .pic{aspect-ratio:4/3}
.gpanel-body{padding:16px 20px;gap:22px}
.gpanel-head{padding:14px 20px}
.mats{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.prompt{font-size:13.5px}
.maker #outImg{max-width:260px}

/* Результати */
.res{display:grid;gap:14px}
.res-row{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) 140px;gap:18px;align-items:center;font-size:19px}
.res-row b{font-family:var(--f-display);font-size:17px}
.bar-o{height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar-o i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--yellow));transition:width .6s}
.res-row .pct{font-family:var(--f-mono);font-weight:600;text-align:right}
.total{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--text);color:var(--bg);border-radius:var(--r);padding:22px 30px}
.total .big{font-size:clamp(56px,8vw,96px);color:var(--lime)}
@media (max-width:980px){
  .dawkins{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dawkins>div:last-child{grid-column:1/-1}
  .memo-wrap{grid-template-columns:minmax(0,1fr)}
  .res-row{grid-template-columns:minmax(0,1fr) 110px}.res-row .bar-o{grid-column:1/-1;grid-row:2}
  .dawkins blockquote{font-size:30px}
  .hist-split{grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:620px){.lab-item .opts{grid-template-columns:minmax(0,1fr)}.memo{grid-template-columns:repeat(3,minmax(0,1fr))!important}.total{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="bar-top"><span class="brand">МЕМОЛОГІЯ<b>11</b></span><span class="done-pill">Виконано: <b id="doneN">0</b> / <span id="doneT">0</span></span><span class="now-lbl" id="nowLbl"></span><span class="spacer"></span></div>
    <ol class="steps ribbon" id="ribbon" aria-label="Розділи уроку"></ol>
  </div>
  <div class="scrollbar"><i id="scrollBar"></i></div>
</header>
<main id="slides"></main>

<div class="lb" id="lb" hidden><button class="btn sm" type="button" id="lbClose">Закрити ✕</button><div style="display:grid;justify-items:center"><img id="lbImg" alt=""><p id="lbCap"></p></div></div>

/* ---------- Оцінювання у відсотках ---------- */
const TESTS={film:{name:'Кіновікторина',sec:'film'},chrono:{name:'Шкала часу',sec:'hist'},quote:{name:'Цитатник',sec:'quote'},detect:{name:'Мем-детектив',sec:'detect'},lab:{name:'Мовна лабораторія',sec:'lab'},truth:{name:'Правда чи міф',sec:'truth'}};
Object.values(TESTS).forEach(t=>{t.n=0;t.ok=0;t.done=0});
const pct=(a,b)=>b?Math.round(a/b*100):0;
function badge(k){const t=TESTS[k];return `Правильно: ${t.ok} / ${t.n} · ${pct(t.ok,t.n)}%`}
function record(k,ok){const t=TESTS[k];t.done++;if(ok)t.ok++;document.querySelectorAll(`[data-score="${k}"]`).forEach(e=>e.textContent=badge(k));if(t.done>=t.n)markDone(t.sec);renderResults()}
const scoreEl=k=>`<span class="pill" data-score="${k}">${badge(k)}</span>`;

$('memoGrid').addEventListener('click',e=>{const c=e.target.closest('.mcard');if(!c||lock||c.classList.contains('open'))return;c.classList.add('open');opened.push(c);
  if(opened.length===2){moves++;const [a,b]=opened;opened=[];
    if(a.dataset.p===b.dataset.p){a.classList.add('got');b.classList.add('got');pairs++;$('memoFound').insertAdjacentHTML('beforeend',`<p>${PAIRS[+a.dataset.p][2]}</p>`);if(pairs===PAIRS.length)markDone('memo')}
    else{lock=true;setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');lock=false},900)}
    $('memoScore').textContent=pairs+' / 6 пар · '+moves+' ходів'}});

/* Етика */
let ethN=0;
slidesEl.addEventListener('click',e=>{const b=e.target.closest('.light');if(!b)return;const card=b.closest('.eth');const first=card.querySelector('.take').hidden;
  card.querySelectorAll('.light').forEach(x=>x.setAttribute('aria-pressed',x===b));card.querySelector('.take').hidden=false;
  if(first){ethN++;$('ethScore').textContent=ethN+' / '+ETH.length;if(ethN===ETH.length)markDone('ethics')}});

/* GIF і майстерня */
['g1','g2','g3'].forEach(id=>$(id).addEventListener('input',()=>{if(['g1','g2','g3'].filter(x=>$(x).value.trim().length>3).length>=2)markDone('gif')}));
slidesEl.addEventListener('input',e=>{if(!e.target.closest('.pad'))return;const n=[...document.querySelectorAll('.pad input')].filter(i=>i.value.trim().length>3).length;$('padScore').textContent=plural(n,'підпис','підписи','підписів');if(n>=3)markDone('work')});

/* Групи */
$('gtabs').addEventListener('click',e=>{const b=e.target.closest('.gtab');if(!b)return;document.querySelectorAll('.gtab').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.gpanel').forEach(p=>p.hidden=p.dataset.p!==b.dataset.g)});
const gt={};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-start]');
  if(s){const id=s.dataset.start,out=document.querySelector(`[data-t="${id}"]`);
    if(gt[id]){clearInterval(gt[id]);gt[id]=null;s.textContent='Продовжити';return}
    let left=gt[id+'L']??480;s.textContent='Пауза';
    gt[id]=setInterval(()=>{left--;gt[id+'L']=left;out.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(gt[id]);gt[id]=null;s.textContent='Час!'}},1000);}
  const c=e.target.closest('[data-copy]');
  if(c){const el=$(c.dataset.copy);const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r);c.textContent='Виділено: скопіюйте вручну'};
    try{navigator.clipboard.writeText(el.textContent).then(()=>{c.textContent='Скопійовано';setTimeout(()=>c.textContent='Скопіювати промпт',1800)},sel)}catch(err){sel()}}
});
document.addEventListener('change',e=>{const box=e.target.closest('[data-chk]');if(!box)return;if([...box.querySelectorAll('input')].every(i=>i.checked))markDone('groups')});

/* Конструктор */
const cv=$('cv'),ctx=cv.getContext('2d'),top=$('top'),bottom=$('bottom');
const TPL=[{c:['#b8e04a','#99cc00','#5d8a00']},{c:['#c3a2ef','#9d6bdb','#5b3a8f']},{c:['#ffe07a','#f7c915','#b38a00']},{n:10,t:'Четверо на лавці'},{n:4,t:'Пильний погляд'},{n:73,t:'Родинне фото початку XX ст.'}];
let tcur=TPL[0],photo=null;
$('tpls').innerHTML=TPL.map((t,i)=>`<button class="tpl" type="button" data-t="${i}" aria-pressed="${i===0}" aria-label="${t.n?esc(t.t):'Кольоровий фон'}" style="${t.c?'background:'+t.c[1]:''}">${t.n?`<img src="${M(t.n)}" alt="">`:''}</button>`).join('');
function wrap(text,maxW){const w=text.toUpperCase().split(/\s+/).filter(Boolean),L=[];let c='';w.forEach(x=>{const t=c?c+' '+x:x;if(ctx.measureText(t).width>maxW&&c){L.push(c);c=x}else c=t});if(c)L.push(c);return L}
function caption(text,atTop){let size=64,L;do{ctx.font=`900 ${size}px Unbounded, Rubik, Impact, sans-serif`;L=wrap(text,720);size-=4}while(L.length>3&&size>30);size+=4;const lh=size*1.12;
  ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle='#000';ctx.fillStyle='#fff';
  L.forEach((l,i)=>{const y=atTop?40+size+i*lh:cv.height-40-(L.length-1-i)*lh;ctx.strokeText(l,400,y);ctx.fillText(l,400,y)})}
function cover(img){const s=Math.max(800/img.width,800/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(800-w)/2,(800-h)/2,w,h)}
function draw(){
  ctx.fillStyle='#1e1b26';ctx.fillRect(0,0,800,800);
  if(photo)cover(photo);
  else if(tcur.c){const [a,b,c]=tcur.c,g=ctx.createRadialGradient(260,240,40,400,400,620);g.addColorStop(0,a);g.addColorStop(.55,b);g.addColorStop(1,c);ctx.fillStyle=g;ctx.fillRect(0,0,800,800);
    ctx.globalAlpha=.16;ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();for(let t=0;t<26;t+=.05){const r=8+t*14;ctx.lineTo(560+Math.cos(t)*r,560+Math.sin(t)*r)}ctx.stroke();ctx.globalAlpha=1}
  else if(tcur.img&&tcur.img.complete)cover(tcur.img);
  caption(top.value,true);caption(bottom.value,false);
}
[top,bottom].forEach(i=>i.addEventListener('input',draw));
$('tpls').addEventListener('click',e=>{const b=e.target.closest('.tpl');if(!b)return;tcur=TPL[+b.dataset.t];photo=null;$('file').value='';
  document.querySelectorAll('.tpl').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(tcur.n&&!tcur.img){tcur.img=new Image();tcur.img.onload=draw;tcur.img.src=M(tcur.n)}draw()});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{photo=img;draw()};img.src=URL.createObjectURL(f)});
$('makeImg').addEventListener('click',()=>{const o=$('outImg');try{o.src=cv.toDataURL('image/png');o.hidden=false}catch(err){$('makeImg').textContent='Зробіть скриншот полотна'}});
draw();
if(document.fonts&&document.fonts.load)document.fonts.load('900 64px Unbounded').then(draw,()=>{});

/* Результати */
function renderResults(){
  const keys=Object.keys(TESTS);let ok=0,n=0;
  $('results').innerHTML=keys.map(k=>{const t=TESTS[k];ok+=t.ok;n+=t.n;const p=pct(t.ok,t.n);return `<div class="res-row"><b>${t.name}</b><div class="bar-o"><i style="width:${p}%"></i></div><span class="pct">${t.ok}/${t.n} · ${p}%</span></div>`}).join('');
  const done=keys.reduce((s,k)=>s+TESTS[k].done,0);
  $('totalPct').textContent=pct(ok,n)+'%';
  $('totalTxt').textContent=`${ok} правильних відповідей з першої спроби з ${n} можливих. Виконано ${done} з ${n} завдань.`;
  if(done===n)markDone('final');
}
renderResults();
onScroll();
})();
</script>

</body>
