<title>Мемологія: урок 11 класу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/*%%BASECSS%%*/
/* Мем-мемо */
.memo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.mcard{aspect-ratio:3/4;border-radius:14px;border:0;padding:0;cursor:pointer;perspective:800px;background:none}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.mcard .f{background:repeating-linear-gradient(45deg,var(--lime) 0 14px,#8bbb00 14px 28px);display:grid;place-items:center;border:2px solid var(--text)}
.mcard .f span{font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--ink)}
.mcard .b{transform:rotateY(180deg);background:#0f0d14;border:2px solid var(--text)}
.mcard .b img{width:100%;height:100%;object-fit:contain}
.mcard.got .b{border-color:var(--right);box-shadow:0 0 0 3px var(--right)}
.memo-found{display:grid;gap:8px;margin-top:16px}
.memo-found p{font-size:14px;background:var(--bg);border-left:4px solid var(--right);padding:8px 12px;border-radius:8px}

/* Цитатник */
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.qcard{background:var(--bg);border-radius:var(--r);padding:16px;display:grid;gap:10px;position:relative;border:1px solid var(--line);min-width:0;align-content:start}
.qcard::before{content:"«";position:absolute;top:-28px;left:10px;font-family:var(--f-display);font-weight:900;font-size:90px;color:var(--violet);line-height:1}
.qcard .pic{aspect-ratio:4/3;border-radius:12px}
.qcard blockquote{margin:0;font-weight:800;font-size:15px;line-height:1.35}

/* Майстерня шаблонів: нотатки */
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}
.pad{background:#fff6b8;color:#1e1b26;padding:10px 10px 14px;border-radius:4px 4px 18px 4px;box-shadow:0 14px 24px -16px rgba(0,0,0,.5);display:grid;gap:8px;min-width:0;align-content:start}
.pad:nth-child(3n+2){background:#d9f2a3;transform:rotate(1deg)}.pad:nth-child(3n){background:#e4d6fa;transform:rotate(-1deg)}
.pad .pic{aspect-ratio:4/3;border-radius:3px}
.pad b{font-size:13px}
.pad input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1.5px solid rgba(30,27,38,.25);background:rgba(255,255,255,.75);color:#1e1b26;width:100%}

/* Кіновікторина: квитки */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.ticket{background:var(--night-2);border:1px solid #3a3448;border-radius:14px;overflow:hidden;display:grid;align-content:start;min-width:0}
.ticket .pic{aspect-ratio:16/9;border-bottom:2px dashed #3a3448}
.ticket .body{padding:14px 12px 12px;display:grid;gap:8px}
.ticket .opt{background:#221d2c;border-color:#3a3448;color:#f4f1f9}
.ticket .explain{color:#c9c3d6;border-color:#3a3448}
.film-hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:24px}
.film-hero .pic{aspect-ratio:3/4;border-radius:16px}

/* Правда чи міф: газета */
.news{background:var(--paper);border-block:4px double var(--text)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px}
.fact{border-top:3px solid var(--text);padding-top:10px;display:grid;gap:10px;align-content:start;position:relative;min-width:0}
.fact .pic{aspect-ratio:4/3;border-radius:4px}
.fact .claim{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.3}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .opt{text-align:center;font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.stamp{position:absolute;top:24px;right:10px;font-family:var(--f-display);font-weight:900;font-size:18px;padding:4px 10px;border:3px solid currentColor;border-radius:8px;transform:rotate(-8deg);background:var(--paper)}
.stamp.t{color:var(--right)}.stamp.f{color:var(--wrong)}

/* Світлофор етики */
.ethics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.eth{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;align-content:start;min-width:0}
.eth .pic{aspect-ratio:4/3}
.eth .body{padding:12px;display:grid;gap:10px}
.lights{display:flex;gap:8px}
.light{flex:1;border:2px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--surface);cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:11.5px;font-weight:800}
.light i{width:22px;height:22px;border-radius:50%;display:block;opacity:.4}
.light.g i{background:#3fbf3f}.light.y i{background:#f7c915}.light.r i{background:#e5484d}
.light[aria-pressed="true"]{border-color:var(--text)}
.light[aria-pressed="true"] i{opacity:1;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.eth .take{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.eth .take b{color:var(--text)}


/* Layout: презентація 16:9. Сцена 1600×900 масштабується під екран; внизу — док зі стрічкою прогресу і навігацією. */
:root{--deck:#0d0b12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--deck:#050407}}
:root[data-theme="dark"]{--deck:#050407}
main{font-size:18px}
.slide{padding-block:56px;position:relative}
.slide>.wrap{display:flex;flex-direction:column;gap:16px;position:relative}
.slide .wrap>.body{flex:1 0 auto}
[hidden]{display:none!important}
.slide h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.slide .sub{font-size:19px;color:var(--muted);max-width:75ch;margin-top:8px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.slide .eyebrow{margin-bottom:8px}
.pill{font-family:var(--f-mono);font-weight:600;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:15px;white-space:nowrap}
.band-night .pill{background:var(--night-text);color:var(--night)}
.s-yellow{background:color-mix(in srgb,var(--yellow) 26%,var(--bg))}
.s-lime{background:color-mix(in srgb,var(--lime) 22%,var(--bg))}
.s-violet{background:color-mix(in srgb,var(--violet) 22%,var(--bg))}
.s-paper{background-color:var(--paper)}

.g{display:grid;gap:18px;align-content:start;align-items:start}
.c2{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}.c3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}.c4{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}.c5{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}.c6{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.pic.a43{aspect-ratio:4/3}.pic.a169{aspect-ratio:16/9}.pic.a11{aspect-ratio:1}.pic.a21{aspect-ratio:2/1}.pic.a1610{aspect-ratio:16/10}.pic.a34{aspect-ratio:3/4}.pic.a41{aspect-ratio:4/1}.pic.a72{aspect-ratio:797/227}.pic.a52{aspect-ratio:5/2}
.pic{border-radius:12px}

/* Титул */
.title-slide{overflow:hidden;padding-block:48px 40px}
.title-slide .mark{position:absolute;pointer-events:none;opacity:.12}
.title-slide .mark.r{right:-8%;top:-12%;width:46%}
.title-slide .mark.l{left:-10%;bottom:-30%;width:34%;opacity:.1}
.title-slide h1{font-size:clamp(44px,8vw,100px);font-weight:900;line-height:.96;letter-spacing:-.025em;position:relative}
.title-slide .lead{font-size:24px;max-width:52ch;position:relative}
.keys{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;position:relative}
.keys span{font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.keys kbd{font-family:var(--f-mono);font-weight:600;background:var(--text);color:var(--bg);border-radius:6px;padding:1px 7px;margin-right:4px}

/* Докінз */
.dawkins{display:grid;grid-template-columns:330px 230px minmax(0,1fr);gap:28px;align-items:stretch}
.dawkins .ph{border-radius:20px;overflow:hidden;background:#000}
.dawkins .ph .pic{height:100%;background:#000}
.dawkins blockquote{margin:0;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.08;letter-spacing:-.01em}
.dawkins blockquote em{font-style:normal;background:var(--lime);color:var(--ink);padding:0 .12em;border-radius:.12em}
.chips3{display:flex;gap:10px;flex-wrap:wrap}
.chips3 span{font-family:var(--f-display);font-weight:800;font-size:15px;padding:9px 14px;border-radius:10px;color:var(--ink)}

/* Історія */
.era{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;color:var(--violet)}
.era small{display:block;font-size:20px;color:var(--muted);margin-top:8px;font-weight:700}
.histtext p{font-size:19px;line-height:1.55}
.histtext p+p{margin-top:12px}
.evo-g article{background:var(--night-2);border:1px solid #3a3448;border-radius:14px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.evo-g .yr{font-family:var(--f-display);font-weight:900;font-size:21px;color:var(--lime);line-height:1}
.evo-g h3{font-size:14px;color:var(--night-text)}
.evo-g p{font-size:12.5px;line-height:1.35;color:color-mix(in srgb,var(--night-text) 72%,transparent)}
.slide.band-night{background:var(--night);color:var(--night-text)}
.slide.band-night .sub,.slide.band-night .eyebrow,.slide.band-night .muted{color:color-mix(in srgb,var(--night-text) 68%,transparent)}
.slide.band-night .min{background:var(--night-2);border-color:#3a3448;color:var(--night-text)}
.mus .pic{aspect-ratio:16/10}
.mus .exh .frame-g{padding:8px;box-shadow:0 0 0 5px #3b2f22,0 16px 30px -12px rgba(0,0,0,.8)}
.mus .plaque{padding:7px 9px}
.mus .plaque b{font-size:12.5px}.mus .plaque p{font-size:11.5px}

/* Форми */
.form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.form p{font-size:14.5px;color:var(--muted);line-height:1.4}
.form .tile{aspect-ratio:2/1;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--f-display);font-weight:800;font-size:22px}

/* Мем-мемо */
.memo-wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.memo{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.mcard{aspect-ratio:4/3}
.memo-found p{font-size:15px}

/* Компактні варіанти компонентів у сцені */
main .moods{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:22px;align-content:start;align-items:start}
main .mood .ph{aspect-ratio:16/10}
main .opt{font-size:15px;padding:8px 11px}
main .explain{font-size:14px}
.qcard{padding:12px}
.qcard::before{font-size:70px;top:-22px}
.qcard blockquote{font-size:15px}
.det .body{padding:9px;gap:6px}
.det .chips button{font-size:12.5px;padding:6px 4px}
.lab-item{grid-template-columns:110px minmax(0,1fr);padding:10px;gap:12px}
.lab-item .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.lab-item .opts .opt{font-size:12.5px;padding:7px 8px}
.lab-item q{font-size:15px;margin-bottom:6px}
.lab-item .explain{font-size:13.5px}
.ticket .body{padding:12px 10px 10px}
.fact .claim{font-size:16px}
.frames{grid-template-columns:repeat(7,170px)!important}
.phones{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))!important;max-width:none!important;gap:30px}
.phone .pic{aspect-ratio:4/3}
.gpanel-body{padding:16px 20px;gap:22px}
.gpanel-head{padding:14px 20px}
.mats{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.prompt{font-size:13.5px}
.maker #outImg{max-width:260px}

/* Мем-батл */
.task-n{justify-self:start}
.bcard{background:var(--bg);border:2px solid var(--text);border-radius:20px;padding:18px;display:grid;gap:10px;align-content:start;box-shadow:6px 6px 0 var(--violet)}
.bcard .bl{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1;color:var(--violet)}
.bcard .bt{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.25}
.bcard .who{font-weight:800;color:var(--right)}
/* Результати */
.res{display:grid;gap:14px}
.res-row{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr) 140px;gap:18px;align-items:center;font-size:19px}
.res-row b{font-family:var(--f-display);font-size:17px}
.bar-o{height:22px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar-o i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--yellow));transition:width .6s}
.res-row .pct{font-family:var(--f-mono);font-weight:600;text-align:right}
.total{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--text);color:var(--bg);border-radius:var(--r);padding:22px 30px}
.total .big{font-size:clamp(56px,8vw,96px);color:var(--lime)}
/* ===== Оновлений дизайн: крупніше, яскравіше ===== */
.wrap{max-width:1300px}
main{font-size:19px}
.slide{padding-block:72px;overflow-x:clip}
.slide h2{font-size:clamp(32px,4.4vw,62px);letter-spacing:-.02em;line-height:1.05}
.slide .sub{font-size:20px;margin-top:12px}
.slide .eyebrow{font-size:13.5px;letter-spacing:.12em}
.slide .eyebrow .subj i{font-size:12.5px;padding:4px 9px}
.pill{font-size:16px;padding:10px 18px}
.plain{background:radial-gradient(55% 45% at 100% 0%,color-mix(in srgb,var(--violet) 16%,transparent),transparent 70%),radial-gradient(45% 40% at 0% 100%,color-mix(in srgb,var(--lime) 16%,transparent),transparent 70%),var(--bg)}
.s-yellow{background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--yellow) 60%,transparent),transparent 70%),radial-gradient(60% 60% at 100% 100%,color-mix(in srgb,var(--lime) 40%,transparent),transparent 70%),color-mix(in srgb,var(--yellow) 12%,var(--bg))}
.s-lime{background:radial-gradient(70% 60% at 100% 0%,color-mix(in srgb,var(--lime) 55%,transparent),transparent 70%),radial-gradient(60% 60% at 0% 100%,color-mix(in srgb,var(--yellow) 35%,transparent),transparent 70%),color-mix(in srgb,var(--lime) 12%,var(--bg))}
.s-violet{background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--violet) 50%,transparent),transparent 70%),radial-gradient(60% 60% at 100% 100%,color-mix(in srgb,#ff8fb3 35%,transparent),transparent 70%),color-mix(in srgb,var(--violet) 12%,var(--bg))}
.title-slide{background:radial-gradient(50% 60% at 85% 20%,color-mix(in srgb,var(--violet) 40%,transparent),transparent 70%),radial-gradient(45% 55% at 10% 90%,color-mix(in srgb,var(--lime) 45%,transparent),transparent 70%),radial-gradient(35% 40% at 60% 100%,color-mix(in srgb,var(--yellow) 40%,transparent),transparent 70%),var(--bg);padding-block:80px 70px!important}
.title-slide h1{font-size:clamp(48px,8.5vw,132px)!important}
.title-slide .lead{font-size:clamp(19px,2vw,26px)!important}
.tgrid{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:center;position:relative}
.qr{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:16px 16px 12px;box-shadow:8px 8px 0 var(--lime);text-align:center}
.qr .pic{aspect-ratio:1;border-radius:12px;background:#fff;width:100%}
.qr .pic img{object-fit:contain}
.qr b{display:block;margin-top:8px;font-family:Unbounded,sans-serif;font-size:18px;color:#16131c}
@media (max-width:980px){.tgrid{grid-template-columns:1fr}.qr{max-width:300px;margin-inline:auto}}
.card,.form,.qcard,.eth,.det,.lab-item,.pola,.ticket,.gpanel{border-radius:22px;box-shadow:0 22px 44px -28px color-mix(in srgb,var(--violet) 70%,transparent)}
.pic{border-radius:14px}
main .opt{font-size:16px;padding:10px 13px;border-radius:12px}
.det .chips button{font-size:13.5px;padding:8px 4px}
.form-tag{font-size:13.5px;padding:5px 11px}
.form p{font-size:15.5px}
.qcard blockquote{font-size:17px}
.lab-item q{font-size:16.5px}
.c4{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))!important}.c5{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))!important}.c6{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))!important}
.bar{box-shadow:0 10px 30px -22px rgba(0,0,0,.5)}
.steps .seg{height:12px}
.steps li.ok .seg{border-color:var(--right)}
.btn{font-size:15px;padding:11px 20px}
/* ===== Крупніше в завданнях, менше елементів у ряду ===== */
.c4{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))!important}
.c5{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))!important}
.dets2,.pads2{grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr))!important;gap:28px!important}
.det .dcap{font-size:21px;font-weight:800;line-height:1.3}
.det .body{padding:18px!important;gap:14px!important}
.det .chips{gap:10px}
.det .chips button{font-size:17px!important;padding:12px 6px!important;border-radius:12px}
.det .why{font-size:17px}
.pad{padding:14px 14px 18px;gap:12px}
.pad input{font-size:19px;padding:13px 14px}
.lab-item{grid-template-columns:200px minmax(0,1fr)!important;padding:16px!important;gap:18px!important}
.lab-item q{font-size:19px!important}
.lab-item .opts{grid-template-columns:minmax(0,1fr)!important}
.lab-item .opts .opt{font-size:16px!important;padding:10px 12px!important}
.lab-item .explain{font-size:16px!important}
.qcard blockquote{font-size:20px}
.qcard .opt,.ticket .opt,.fact .tf .opt{font-size:17px}
.fact .claim{font-size:20px}
.eth .body span{font-size:17px!important}
.ticket .body span{font-size:16px!important}
.qcard .explain,.ticket .explain,.fact .explain{font-size:16px}
/* Декор */
.slide>.wrap>.bignum{position:absolute;right:-6px;top:-64px;font-family:var(--f-display);font-weight:900;font-size:clamp(120px,14vw,230px);line-height:1;color:transparent;-webkit-text-stroke:3px color-mix(in srgb,var(--violet) 55%,transparent);opacity:.55;pointer-events:none;user-select:none;z-index:0}
.band-night>.wrap>.bignum{-webkit-text-stroke-color:color-mix(in srgb,var(--lime) 60%,transparent)}
.shead{position:relative;z-index:1}
.slide>.wrap>.body,.slide>.wrap>.legend{position:relative;z-index:1}
.slide::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-60px;top:40%;background:conic-gradient(from 90deg,var(--lime),var(--yellow),var(--violet),var(--lime));opacity:.14;filter:blur(2px);pointer-events:none}
.slide:nth-child(even)::before{left:auto;right:-70px;top:65%}
.slide::after{content:"✦";position:absolute;right:4%;bottom:28px;font-size:46px;color:var(--violet);opacity:.35;pointer-events:none;transform:rotate(12deg)}
.slide:nth-child(3n)::after{content:"✺";color:var(--lime);left:4%;right:auto}
.slide:nth-child(3n+1)::after{content:"✸";color:var(--yellow)}
.slide h2{text-shadow:0 2px 0 color-mix(in srgb,var(--lime) 35%,transparent)}
.band-night h2{text-shadow:none}
@media (max-width:980px){
  .dawkins{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dawkins>div:last-child{grid-column:1/-1}
  .memo-wrap{grid-template-columns:minmax(0,1fr)}
  .res-row{grid-template-columns:minmax(0,1fr) 110px}.res-row .bar-o{grid-column:1/-1;grid-row:2}
  .dawkins blockquote{font-size:30px}
  .hist-split{grid-template-columns:minmax(0,1fr)!important}
}

</style>

<header class="bar">
  <div class="wrap">
    <div class="bar-top"><span class="brand">МЕМОЛОГІЯ<b>11</b></span><span class="done-pill">Виконано: <b id="doneN">0</b> / <span id="doneT">0</span></span><span class="now-lbl" id="nowLbl"></span><span class="spacer"></span></div>

</header>

<div class="lb" id="lb" hidden><button class="btn sm" type="button" id="lbClose">Закрити ✕</button><div style="display:grid;justify-items:center"><img id="lbImg" alt=""><p id="lbCap"></p></div></div>

<script>
(()=>{
const LOGO='%%LOGO%%',SPIRAL='%%SPIRAL%%',FEATHER='%%FEATHER%%';
const M=k=>typeof k==='number'?'m/'+String(k).padStart(3,'0')+'.webp':k[0]==='z'?'m/z'+k.slice(1).padStart(3,'0')+'.webp':'m/'+k+'.webp';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pic=(n,alt,cls='a43')=>`<button class="pic ${cls}" type="button" data-zoom="${n}" data-cap="${esc(alt)}" aria-label="Збільшити: ${esc(alt)}"><img src="${M(n)}" alt="${esc(alt)}" loading="lazy"></button>`;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chunk=(a,n)=>a.reduce((r,x,i)=>(i%n?r[r.length-1].push(x):r.push([x]),r),[]);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const mixed=ops=>{const ok=ops[0],s=shuffle(ops);return [s,s.indexOf(ok)]};
const optsHTML=(ops,ok)=>ops.map((o,i)=>`<button class="opt" type="button"${i===ok?' data-ok':''}>${o}</button>`).join('');

/* ---------- Оцінювання у відсотках ---------- */
const TESTS={film:{name:'Кіновікторина',sec:'film'},chrono:{name:'Шкала часу',sec:'hist'},quote:{name:'Цитатник',sec:'quote'},detect:{name:'Мем-детектив',sec:'detect'},lab:{name:'Мовна лабораторія',sec:'lab'},truth:{name:'Правда чи міф',sec:'truth'}};
Object.values(TESTS).forEach(t=>{t.n=0;t.ok=0;t.done=0});
const pct=(a,b)=>b?Math.round(a/b*100):0;
function badge(k){const t=TESTS[k];return `Правильно: ${t.ok} / ${t.n} · ${pct(t.ok,t.n)}%`}
function record(k,ok){const t=TESTS[k];t.done++;if(ok)t.ok++;document.querySelectorAll(`[data-score="${k}"]`).forEach(e=>e.textContent=badge(k));if(t.done>=t.n)markDone(t.sec);renderResults()}
const scoreEl=k=>`<span class="pill" data-score="${k}">${badge(k)}</span>`;

/* ---------- Слайди ---------- */
const SECS=[['start','Старт'],['warm','Розминка'],['theory','Теорія'],['hist','Історія'],['forms','Форми'],['memo','Мем-мемо'],['work','Майстерня'],['quote','Цитати'],['detect','Детектив'],['film','Кіно'],['lab','Мова'],['truth','Правда/міф'],['ethics','Етика'],['gif','GIF'],['groups','Групи'],['ai','ШІ-батл'],['final','Підсумок']];
const S=[];
const add=(sec,cls,html)=>S.push({sec,cls,html});
const head=(eye,title,sub,score)=>{const m=/^Завдання (\d+)/.exec(eye);return `${m?`<span class="bignum" aria-hidden="true">${m[1].padStart(2,'0')}</span>`:''}<div class="shead"><div><div class="eyebrow">${eye}</div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${score||''}</div>`};
const subj=(...a)=>`<span class="subj">${a.map(x=>({m:'<i class="m">мова</i>',l:'<i class="lt">література</i>',h:'<i class="h">історія</i>'})[x]).join('')}</span>`;

/* 1. Титул */
add('start','title-slide',`<img class="mark r" src="${SPIRAL}" alt=""><img class="mark l" src="${FEATHER}" alt="">
<div class="tgrid"><div>
<img class="logo" src="${LOGO}" alt="Midgard" style="margin-bottom:6px;position:relative">
<div class="tags" style="margin:0;position:relative"><span class="sticker g">Українська мова</span><span class="sticker y">Література</span><span class="sticker v">Історія</span></div>
<h1>Мем — це <span class="hl">фольклор</span><br><span class="out">XXI</span> століття</h1>
<p class="lead">Інтегрований урок для 11 класу: від давньоєгипетських остраконів до «6-7», від «протягом» до Будапештського меморандуму.</p>
<div class="keys"><span>Натисніть на будь-який мем, щоб відкрити його на весь екран</span></div></div>
<div class="qr"><button class="pic" type="button" data-zoom="qr" data-cap="Відскануйте QR-код" aria-label="Збільшити QR-код"><img src="${M('qr')}" alt="QR-код до уроку"></button><b>Відскануйте QR-код 📱</b></div></div>`);

/* 2. Розминка */
const MOODS=[[7,'Кіану на лавці','Сумую за канікулами'],[6,'Математичні розрахунки','Нічого не зрозуміло, але цікаво'],[32,'Керміт за кермом','Погнали, я готовий!'],[30,'Задоволений Пікар','Нарешті щось цікаве'],[29,'Ді Капріо крокує','Упевнений у собі'],[2,'Мружиться над папірцем','Придивляюся, що тут'],[5,'Шокований Кіану','Що взагалі відбувається?'],[13,'Лисиця на стільці','Ще сплю, будьте ніжні']];
const voteHTML=items=>items.map(([n,t,s])=>`<button class="mood" type="button" data-v="0"><span class="votes" hidden>0</span><span class="ph"><img src="${M(n)}" alt="${esc(t)}" loading="lazy"></span><b>${t}</b><span>${s}</span></button>`).join('');
add('warm','s-yellow',head('Розминка','Який ти мем сьогодні?','Підніміть руку за свій настрій. Кожен клік по картці — один голос.','<span class="pill" id="voteTotal">0 голосів</span>')+`<div class="body"><div class="moods" id="moods">${voteHTML(MOODS)}</div></div>`);

/* 3. Докінз */
add('theory','',`<div class="eyebrow">Теорія ${subj('m','l','h')}</div>
<div class="dawkins body">
  <div class="ph">${pic('p11','Річард Докінз — британський біолог, автор терміна «мем»','a34')}</div>
  <div style="display:grid;gap:14px;align-content:start">${pic('p12','Обкладинка книжки Річарда Докінза «Егоїстичний ген» (1976)','a34')}<p class="muted" style="font-size:15px">«Егоїстичний ген», 1976. Саме тут уперше з'явилося слово «мем».</p></div>
  <div style="display:grid;gap:20px;align-content:start">
    <blockquote>Мем — це <em>вірус</em>, що вже вас захопив</blockquote>
    <p style="font-size:20px"><b>Річард Докінз</b>, британський біолог. Головна ідея: дарвінівська еволюція діє не лише на біологічному рівні (через гени), а й на культурному.</p>
    <p style="font-size:20px">Мем — одиниця інформації, що живе в людській культурі. Це може бути будь-що, що передається від однієї людини до іншої шляхом наслідування: мелодія, фраза, жест, картинка. Слово походить від грецького <i>mímēma</i>, «наслідування», і співзвучне з <i>gene</i>.</p>
    <div><p style="font-weight:800;margin-bottom:8px">Три ознаки мему</p><div class="chips3"><span style="background:var(--lime)">Упізнаваний шаблон</span><span style="background:var(--yellow)">Нові варіації</span><span style="background:#c9b2ef">Спільний контекст</span></div></div>
  </div>
</div>`);

/* 4. Анатомія */
add('theory','',head('Теорія','Анатомія мему: шаблон → варіація','Шаблон знають усі, а сенс щоразу новий.')+`<div class="body g hist-split" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px;align-items:start">
<div class="card"><div class="anat"><figure class="fig" style="margin:0">${pic(3,'Шаблон: Чарлі зі стіною розслідування, серіал «У Філадельфії завжди сонячно»')}<b class="lab">Шаблон</b><figcaption>Кадр із серіалу: людина пояснює «змову» на стіні з нитками.</figcaption></figure><span class="arrow" aria-hidden="true">→</span><figure class="fig" style="margin:0">${pic(85,'Варіація: викладачі адаптують навчальні плани після кожної повітряної тривоги')}<b class="lab">Варіація</b><figcaption>Той самий кадр, новий контекст: «викладачі після кожної повітряної тривоги».</figcaption></figure></div></div>
<div class="card"><div class="fig"><b class="lab">Один шаблон — два контексти</b><div class="g" style="grid-template-columns:1fr 1fr;gap:8px">${pic(11,'Гарольд: «Тім лід не може вигоріти, бо лід не горить, а тане»','a11')}${pic(46,'Гарольд: новини про посольства і «Сталкер 2»','a11')}</div><p class="cap">«Гарольд, що приховує біль»: мовна гра про тімліда і жарт про новини.</p></div></div></div>`);

/* 5. Форми мемів */
const FORMS=[[44,'Image macro','Фото + великий напис угорі й унизу. Віллі Вонка: «Ну давай, розкажи, що не плакав над Хатіко».'],[41,'Комікс-шаблон','Кадри з репліками. Тут машинний переклад не впізнав «Козацький рід».'],[31,'Двопанельний вибір','Дрейк: «ні» верхньому варіанту, «так» нижньому. Шаблон для порівнянь.'],[8,'Стартовий набір','Колаж речей, за якими впізнають «тип» людини.'],[22,'Ремікс-колаж','Один персонаж «переїжджає» з кадру в кадр різних фільмів.'],['z22','Фотожаба','Відомий портрет + сучасна деталь: Шевченко з телефоном і в окулярах.'],['z45','Демотиватор','Фото в чорній рамці й підпис-висновок унизу: «Вчитель математики не втримався».'],['z87','Rage comics','Мальовані «обличчя-емоції», які вставляють у короткі комікси.'],['z164','Діаграма','Кругова діаграма чи графік з абсурдними даними: «Толя забрав чижика».'],[104,'Стікери','Наліпки для месенджерів: «Я в калідорі», «Байрактаріс!», «Степан Пантера».'],[106,'Відеотренд','TikTok-тренд «я тоже хочу шоколадку». «Тоже» — русизм, українською «теж».'],[null,'Звуковий мем','Пісня чи фраза, під яку знімають тисячі відео: «Доброго вечора, ми з України».']];
chunk(FORMS,99).forEach((part,i)=>add('forms','',head('Теорія','Форми мемів'+(i?' (продовження)':''),i?'':'Мем — не лише картинка з підписом. Ось 12 поширених форм.')+`<div class="body g c3">${part.map(([n,t,c])=>`<figure class="form" style="margin:0">${n===null?`<a class="tile" href="https://www.youtube.com/results?search_query=%D0%94%D0%BE%D0%B1%D1%80%D0%BE%D0%B3%D0%BE+%D0%B2%D0%B5%D1%87%D0%BE%D1%80%D0%B0+%D0%BC%D0%B8+%D0%B7+%D0%A3%D0%BA%D1%80%D0%B0%D1%97%D0%BD%D0%B8" target="_blank" rel="noopener">«Доброго вечора, ми з України» ↗</a>`:pic(n,t+': '+c,'a52')}<span class="form-tag">${t}</span><p>${c}</p></figure>`).join('')}</div>`));

/* 6. Кіновікторина */
const FILM=[['z31','Замерзлий чоловік у снігу',['«Сяйво» (1980)','«Титанік» (1997)','«Пролітаючи над гніздом зозулі» (1975)'],'Джек Ніколсон у фіналі «Сяйва». Мем — про холод у квартирі без опалення.'],['z52','«Не можна просто так взяти і не запостити цей мем»',['«Володар перснів: Братство Персня» (2001)','«Гра престолів»','«Гаррі Поттер»'],'Боромир: «Не можна просто так взяти і увійти в Мордор».'],['z86','«Донт пуш зе хорсес»',['«Гра в кальмара» (2021)','«Паразити» (2019)','«Олдбой» (2003)'],'Дослівний переклад вислову «не жени коней» — калька, яка англійською не має сенсу.'],['z72','Ді Капріо піднімає келих',['«Великий Гетсбі» (2013)','«Вовк з Уолл-стріт» (2013)','«Титанік» (1997)'],'Гетсбі вітає гостей. Мем — «тост» за чийсь успіх.'],['z6','«Приходиш до мене і просиш поваги, але надсилаєш голосові без попередження»',['«Хрещений батько» (1972)','«Славні хлопці» (1990)','«Обличчя зі шрамом» (1983)'],'Вито Корлеоне: «Ти приходиш і просиш, але робиш це без поваги».'],['z51','«Вчителі, коли складають розклад уроків»',['«Остін Паверс»','«Сам удома»','«Маска»'],'Доктор Зло та його поплічники зловісно регочуть.'],['z56','Розгублений чоловік у порожній кімнаті',['«Кримінальне чтиво» (1994)','«Матриця» (1999)','«Бійцівський клуб» (1999)'],'Вінсент Вега (Джон Траволта) шукає, де всі.'],['z29','Хитра усмішка Пітера Паркера',['«Людина-павук 3» (2007)','«Месники» (2012)','«Сутінки» (2008)'],'Тобі Магвайр у «Людині-павуку 3». Мем — самовпевнена усмішка.']];
TESTS.film.n=FILM.length;
const ticket=([n,cap,ops,ex],i)=>{const [s,k]=mixed(ops);return `<article class="ticket">${pic(n,cap,'a169')}<div class="body"><span class="mono" style="font-size:11px;color:var(--yellow)">КВИТОК № ${String(i+1).padStart(2,'0')}</span><span style="font-size:14px;font-weight:700;color:#f4f1f9">${esc(cap)}</span><div class="opts" data-q data-test="film">${optsHTML(s,k)}</div><p class="explain" hidden>${ex}</p></div></article>`};
add('film','band-night',head('Завдання 6 · фронтально','Кіновікторина: з яких фільмів ці меми?','Більшість шаблонів — кадри з фільмів. Зараховується перша відповідь.',scoreEl('film'))+`<div class="body g c4"><div>${pic('z26','«З яких фільмів ці меми?» — Ді Капріо показує на екран','a34')}</div>${FILM.map(ticket).join('')}</div>`);

/* 7. Історія мемів */
add('hist','s-paper',`<div class="eyebrow">Історія мемів ${subj('h')}</div>
<div class="body g hist-split" style="grid-template-columns:480px minmax(0,1fr);gap:34px">
  <div class="histtext" style="display:grid;gap:16px;align-content:start">
    <div class="era">3000+ років<small>Мемам — більше, ніж пірамідам Гізи? Майже!</small></div>
    <h2 style="font-size:36px">Меми Стародавнього Єгипту</h2>
    <p>Близько 1200 року до н. е., за доби Нового царства, художники з селища Дейр ель-Медіна малювали на <b>остраконах</b> — уламках вапняку й кераміки — смішні сценки.</p>
    <p>Улюблений сюжет — «світ навиворіт»: кіт пасе гусей, кіт прислуговує мишачій пані. Ті самі сюжети є на сатиричних папірусах. Шаблон, який повторюють і змінюють, — це вже мем.</p>
  </div>
  <div class="g" style="grid-template-rows:auto 1fr;gap:16px">
    ${pic('p15e','Сатиричний папірус: тварини в людських ролях, Стародавній Єгипет','a72')}
    <div class="g" style="grid-template-columns:1fr 1fr">${pic('p16','Остракон: кіт прислуговує мишачій пані','a43')}${pic('p17','Остракон: кіт пасе гусей','a43')}</div>
  </div>
</div>`);
add('hist','s-paper',`<div class="eyebrow">Історія мемів ${subj('h','l')}</div>
<div class="body g hist-split" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:30px">
  <div style="display:grid;gap:14px;align-content:start"><div class="era" style="font-size:52px">XVII–XIX ст.<small>Меми до інтернету</small></div>${pic('z144','Ілля Рєпін, «Запорожці пишуть листа турецькому султанові» (1880–1891)','a169')}<p style="font-size:17px"><b>Лист запорожців турецькому султанові</b> (XVII ст.) — зухвалу відповідь переписували століттями. Рєпін намалював, як її пишуть, і картина стала шаблоном для тисяч пародій.</p></div>
  <div style="display:grid;gap:14px;align-content:start">${pic('z57','Обкладинка «Енеїди» Котляревського: козак-Еней','a11')}<p style="font-size:17px"><b>1798, «Енеїда»</b> Котляревського: відомий сюжет Вергілія переробили на козацький лад. Узяти шаблон і змінити контекст — так працює мем.</p><p style="font-size:17px"><b>1845</b>, Шевченко: «Борітеся — поборете!» досі живе на плакатах і в соцмережах.</p></div>
</div>`);
add('hist','s-paper',`<div class="eyebrow">Історія мемів ${subj('h')}</div>
<div class="body g hist-split" style="grid-template-columns:480px minmax(0,1fr);gap:34px">
  <div class="histtext" style="display:grid;gap:16px;align-content:start">
    <div class="era" style="font-size:56px">XX століття<small>Мем як зброя</small></div>
    <h2 style="font-size:34px">Пропаганда</h2>
    <p>Пропаганда не завжди прямолінійна. Часто її нав'язували через анекдоти, карикатури, плакати… усе, що зараз назвали б мемами.</p>
    <p>Радянська влада «вписувала» вождів і нову техніку в кожне село: картинки повторювали, доки вони не ставали «нормою».</p>
    <p>А в <b>1976</b> році Річард Докінз нарешті дав цьому явищу назву — <b>мем</b>.</p>
  </div>

slidesEl.innerHTML=S.map(s=>{const id=seenSec.has(s.sec)?'':` id="sec-${s.sec}"`;seenSec.add(s.sec);return `<section class="slide ${s.cls||'plain'}"${id} data-sec="${s.sec}"><div class="wrap">${s.html}</div></section>`}).join('');
const slides=[...slidesEl.children];
const counts={};S.forEach(s=>counts[s.sec]=(counts[s.sec]||0)+1);
$('ribbon').innerHTML=SECS.map(([k,n])=>`<li data-sec="${k}" style="flex:${counts[k]||1}"><a href="#sec-${k}"><span class="seg"><i></i></span><small>${n}</small></a></li>`).join('');
const TASKS=['warm','hist','memo','work','quote','detect','film','lab','truth','ethics','gif','groups','ai','final'];
$('doneT').textContent=TASKS.length;
const done=new Set();
function markDone(sec){if(done.has(sec))return;done.add(sec);const li=document.querySelector(`.ribbon li[data-sec="${sec}"]`);if(li)li.classList.add('ok');$('doneN').textContent=TASKS.filter(t=>done.has(t)).length}
function onScroll(){
  const y=innerHeight*0.35,h=document.documentElement;
  $('scrollBar').style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%';
  SECS.forEach(([k,n])=>{const secs=slides.filter(x=>x.dataset.sec===k);if(!secs.length)return;const r0=secs[0].getBoundingClientRect(),r1=secs[secs.length-1].getBoundingClientRect(),top=r0.top,bot=r1.bottom;
    const f=Math.max(0,Math.min(1,(y-top)/(bot-top)));const li=document.querySelector(`.ribbon li[data-sec="${k}"]`);li.querySelector('.seg i').style.width=(f*100)+'%';
    const now=y>=top&&y<bot;li.classList.toggle('now',now);if(now)$('nowLbl').textContent='Зараз: '+n});
}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',onScroll);
addEventListener('keydown',e=>{if(e.key==='Escape')$('lb').hidden=true});

/* ---------- Лайтбокс ---------- */
const lb=$('lb');
document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(!z)return;const v=z.dataset.zoom,k=/^\d+$/.test(v)?+v:v;$('lbImg').src=M(k);$('lbImg').alt=z.dataset.cap;$('lbCap').textContent=z.dataset.cap;lb.hidden=false});
lb.addEventListener('click',()=>{lb.hidden=true});

/* ---------- Голосування ---------- */
const plural=(t,a,b,c)=>t+' '+(t%10===1&&t%100!==11?a:t%10>=2&&t%10<=4&&(t%100<10||t%100>=20)?b:c);
function voting(el,onVote){el.addEventListener('click',e=>{const b=e.target.closest('.mood');if(!b)return;const v=+b.dataset.v+1;b.dataset.v=v;const c=b.querySelector('.votes');c.hidden=false;c.textContent=v;onVote()})}
voting($('moods'),()=>{$('voteTotal').textContent=plural([...$('moods').children].reduce((s,b)=>s+ +b.dataset.v,0),'голос','голоси','голосів');markDone('warm')});
voting($('refl'),()=>{});

/* ---------- Тести з вибором (перша спроба) ---------- */
slidesEl.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;const g=b.closest('[data-q]');if(!g||g.dataset.done)return;
  const first=!g.dataset.tried;g.dataset.tried=1;
  if(b.hasAttribute('data-ok')){b.classList.add('ok');g.dataset.done=1;const ex=g.parentElement.querySelector('.explain');if(ex)ex.hidden=false;record(g.dataset.test,first)}
  else b.classList.add('bad');
});
/* Детектив */
slidesEl.addEventListener('click',e=>{const b=e.target.closest('.det .chips button');if(!b)return;const card=b.closest('.det');if(card.classList.contains('solved'))return;
  const first=!card.dataset.tried;card.dataset.tried=1;
  if(b.dataset.k===card.dataset.c){b.classList.add('ok');card.classList.add('solved');card.querySelector('.why').hidden=false;record('detect',first)}else b.classList.add('bad')});
/* Правда чи міф */
slidesEl.addEventListener('click',e=>{const b=e.target.closest('.tf .opt');if(!b)return;const f=b.closest('.fact');if(f.dataset.done)return;f.dataset.done=1;
  const ok=b.dataset.a===f.dataset.t;b.classList.add(ok?'ok':'bad');if(!ok)f.querySelector(`[data-a="${f.dataset.t}"]`).classList.add('ok');
  f.insertAdjacentHTML('beforeend',`<span class="stamp ${f.dataset.t==='1'?'t':'f'}">${f.dataset.t==='1'?'ПРАВДА':'МІФ'}</span>`);f.querySelector('.explain').hidden=false;record('truth',ok)});
/* Шкала часу */
const order=[];const frames=[...$('frames').children];let chronoScored=false;
$('frames').addEventListener('click',e=>{const f=e.target.closest('.frame');if(!f||f.classList.contains('picked'))return;order.push(+f.dataset.i);f.classList.add('picked');const o=f.querySelector('.ord');o.hidden=false;o.textContent=order.length});
$('chronoCheck').addEventListener('click',()=>{
  if(order.length<CHR.length){$('chronoMsg').textContent='Розставте всі '+CHR.length+' кадрів.';return}
  let ok=0;frames.forEach(f=>{const i=+f.dataset.i,good=order.indexOf(i)===i;ok+=good;f.classList.toggle('good',good);f.classList.toggle('badpos',!good);f.querySelector('.when').hidden=false;f.querySelector('.ord').textContent=good?'✓':i+1});
  $('chronoMsg').textContent=ok===CHR.length?'Ідеально! Уся шкала правильна.':'Цифри на червоних кадрах — правильне місце.';
  if(!chronoScored){chronoScored=true;for(let k=0;k<CHR.length;k++)record('chrono',k<ok)}});
$('chronoReset').addEventListener('click',()=>{order.length=0;frames.forEach(f=>{f.className='frame';f.querySelector('.ord').hidden=true;f.querySelector('.when').hidden=true});$('chronoMsg').textContent=chronoScored?'Результат уже зараховано, це тренувальна спроба.':''});

/* Мем-мемо */
let opened=[],moves=0,pairs=0,lock=false;
$('memoGrid').addEventListener('click',e=>{const c=e.target.closest('.mcard');if(!c||lock||c.classList.contains('open'))return;c.classList.add('open');opened.push(c);
  if(opened.length===2){moves++;const [a,b]=opened;opened=[];
    if(a.dataset.p===b.dataset.p){a.classList.add('got');b.classList.add('got');pairs++;$('memoFound').insertAdjacentHTML('beforeend',`<p>${PAIRS[+a.dataset.p][2]}</p>`);if(pairs===PAIRS.length)markDone('memo')}
    else{lock=true;setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');lock=false},900)}
    $('memoScore').textContent=pairs+' / 6 пар · '+moves+' ходів'}});

/* Етика */
let ethN=0;
slidesEl.addEventListener('click',e=>{const b=e.target.closest('.light');if(!b)return;const card=b.closest('.eth');const first=card.querySelector('.take').hidden;
  card.querySelectorAll('.light').forEach(x=>x.setAttribute('aria-pressed',x===b));card.querySelector('.take').hidden=false;
  if(first){ethN++;$('ethScore').textContent=ethN+' / '+ETH.length;if(ethN===ETH.length)markDone('ethics')}});

/* GIF і майстерня */
['g1','g2','g3'].forEach(id=>$(id).addEventListener('input',()=>{if(['g1','g2','g3'].filter(x=>$(x).value.trim().length>3).length>=2)markDone('gif')}));
slidesEl.addEventListener('input',e=>{if(!e.target.closest('.pad'))return;const n=[...document.querySelectorAll('.pad input')].filter(i=>i.value.trim().length>3).length;$('padScore').textContent=plural(n,'підпис','підписи','підписів');if(n>=3)markDone('work')});

/* Групи */
$('gtabs').addEventListener('click',e=>{const b=e.target.closest('.gtab');if(!b)return;document.querySelectorAll('.gtab').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.gpanel').forEach(p=>p.hidden=p.dataset.p!==b.dataset.g)});
const gt={};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-start]');
  if(s){const id=s.dataset.start,out=document.querySelector(`[data-t="${id}"]`);
    if(gt[id]){clearInterval(gt[id]);gt[id]=null;s.textContent='Продовжити';return}
    let left=gt[id+'L']??480;s.textContent='Пауза';
    gt[id]=setInterval(()=>{left--;gt[id+'L']=left;out.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(gt[id]);gt[id]=null;s.textContent='Час!'}},1000);}
  const c=e.target.closest('[data-copy]');
  if(c){const el=$(c.dataset.copy);const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const g=getSelection();g.removeAllRanges();g.addRange(r);c.textContent='Виділено: скопіюйте вручну'};
    try{navigator.clipboard.writeText(el.textContent).then(()=>{c.textContent='Скопійовано';setTimeout(()=>c.textContent='Скопіювати промпт',1800)},sel)}catch(err){sel()}}
});
document.addEventListener('change',e=>{const box=e.target.closest('[data-chk]');if(!box)return;if([...box.querySelectorAll('input')].every(i=>i.checked))markDone('groups')});

/* Конструктор */
const cv=$('cv'),ctx=cv.getContext('2d'),top=$('top'),bottom=$('bottom');
const TPL=[{c:['#b8e04a','#99cc00','#5d8a00']},{c:['#c3a2ef','#9d6bdb','#5b3a8f']},{c:['#ffe07a','#f7c915','#b38a00']},{n:10,t:'Четверо на лавці'},{n:4,t:'Пильний погляд'},{n:73,t:'Родинне фото початку XX ст.'},...PADS.map(([n,t])=>({n,t}))];
let tcur=TPL[0],photo=null;
$('tpls').innerHTML=TPL.map((t,i)=>`<button class="tpl" type="button" data-t="${i}" aria-pressed="${i===0}" aria-label="${t.n?esc(t.t):'Кольоровий фон'}" style="${t.c?'background:'+t.c[1]:''}">${t.n?`<img src="${M(t.n)}" alt="">`:''}</button>`).join('');
function wrap(text,maxW){const w=text.toUpperCase().split(/\s+/).filter(Boolean),L=[];let c='';w.forEach(x=>{const t=c?c+' '+x:x;if(ctx.measureText(t).width>maxW&&c){L.push(c);c=x}else c=t});if(c)L.push(c);return L}
function caption(text,atTop){let size=64,L;do{ctx.font=`900 ${size}px Unbounded, Rubik, Impact, sans-serif`;L=wrap(text,720);size-=4}while(L.length>3&&size>30);size+=4;const lh=size*1.12;
  ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle='#000';ctx.fillStyle='#fff';
  L.forEach((l,i)=>{const y=atTop?40+size+i*lh:cv.height-40-(L.length-1-i)*lh;ctx.strokeText(l,400,y);ctx.fillText(l,400,y)})}
function cover(img){const s=Math.max(800/img.width,800/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(800-w)/2,(800-h)/2,w,h)}
function draw(){
  ctx.fillStyle='#1e1b26';ctx.fillRect(0,0,800,800);
  if(photo)cover(photo);
  else if(tcur.c){const [a,b,c]=tcur.c,g=ctx.createRadialGradient(260,240,40,400,400,620);g.addColorStop(0,a);g.addColorStop(.55,b);g.addColorStop(1,c);ctx.fillStyle=g;ctx.fillRect(0,0,800,800);
    ctx.globalAlpha=.16;ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();for(let t=0;t<26;t+=.05){const r=8+t*14;ctx.lineTo(560+Math.cos(t)*r,560+Math.sin(t)*r)}ctx.stroke();ctx.globalAlpha=1}
  else if(tcur.img&&tcur.img.complete)cover(tcur.img);
  caption(top.value,true);caption(bottom.value,false);
}
[top,bottom].forEach(i=>i.addEventListener('input',draw));
$('tpls').addEventListener('click',e=>{const b=e.target.closest('.tpl');if(!b)return;tcur=TPL[+b.dataset.t];photo=null;$('file').value='';
  document.querySelectorAll('.tpl').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(tcur.n&&!tcur.img){tcur.img=new Image();tcur.img.onload=draw;tcur.img.src=M(tcur.n)}draw()});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{photo=img;draw()};img.src=URL.createObjectURL(f)});
$('makeImg').addEventListener('click',()=>{const o=$('outImg');try{o.src=cv.toDataURL('image/png');o.hidden=false}catch(err){$('makeImg').textContent='Зробіть скриншот полотна'}});
draw();
if(document.fonts&&document.fonts.load)document.fonts.load('900 64px Unbounded').then(draw,()=>{});

/* Мем-батл */
let bOrder=null,bH=0,bA=0;
$('bShuffle').addEventListener('click',()=>{const h=$('capH').value.trim(),a=$('capA').value.trim();if(!h||!a){$('bMsg').textContent='Впишіть обидва підписи.';return}$('bMsg').textContent='';
  bOrder=Math.random()<.5?['h','a']:['a','h'];const cards=[...document.querySelectorAll('.bcard')];
  cards.forEach((c,i)=>{c.querySelector('.bt').textContent=bOrder[i]==='h'?h:a;c.querySelector('b').textContent='0';const w=c.querySelector('.who');w.hidden=true;w.textContent=bOrder[i]==='h'?'Автори: учні':'Автор: ШІ'});
  $('bArena').hidden=false;$('bReveal').hidden=false;$('bNext').hidden=true;$('bQs').hidden=true});
$('bArena').addEventListener('click',e=>{const b=e.target.closest('[data-bv]');if(!b||!$('bNext').hidden)return;const x=b.querySelector('b');x.textContent=+x.textContent+1});
$('bReveal').addEventListener('click',()=>{const cards=[...document.querySelectorAll('.bcard')];const v=cards.map(c=>+c.querySelector('b').textContent);
  cards.forEach(c=>c.querySelector('.who').hidden=false);
  if(v[0]!==v[1]){const win=bOrder[v[0]>v[1]?0:1];if(win==='h')bH++;else bA++}
  $('battleScore').textContent=`Людина ${bH} : ${bA} ШІ`;$('bReveal').hidden=true;$('bNext').hidden=false;$('bQs').hidden=false;markDone('ai')});
$('bNext').addEventListener('click',()=>{$('capH').value='';$('capA').value='';$('bArena').hidden=true;$('bNext').hidden=true;$('bQs').hidden=true});


/* Результати */
function renderResults(){
  const keys=Object.keys(TESTS);let ok=0,n=0;
  $('results').innerHTML=keys.map(k=>{const t=TESTS[k];ok+=t.ok;n+=t.n;const p=pct(t.ok,t.n);return `<div class="res-row"><b>${t.name}</b><div class="bar-o"><i style="width:${p}%"></i></div><span class="pct">${t.ok}/${t.n} · ${p}%</span></div>`}).join('');
  const done=keys.reduce((s,k)=>s+TESTS[k].done,0);
  $('totalPct').textContent=pct(ok,n)+'%';
  $('totalTxt').textContent=`${ok} правильних відповідей з першої спроби з ${n} можливих. Виконано ${done} з ${n} завдань.`;
  if(done===n)markDone('final');
}
renderResults();
onScroll();
})();
</script>
